[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codesaver"
version = "1.3.9"
description = "Cross-platform code backup utility with CLI and optional PyQt5 Desktop application"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "CodeSaver Contributors" }]
keywords = ["backup", "developer-tools", "zip", "cli", "desktop", "pyqt5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/vibecraft01/CodeSaver"
Documentation = "https://github.com/vibecraft01/CodeSaver/blob/main/README.md"
Releases = "https://github.com/vibecraft01/CodeSaver/releases"
Issues = "https://github.com/vibecraft01/CodeSaver/issues"

[project.scripts]
codesaver = "codesaver.cli:main"
codesaver-desktop = "desktop.main:main"

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "flake8>=7.0",
]
release = [
    "pyinstaller>=6.0",
]
desktop = [
    "PyQt5>=5.15",
]

[tool.codesaver.desktop]
version = "1.2.6"
python_requires = ">=3.10"
framework = "PyQt5"

[tool.setuptools.packages.find]
include = ["codesaver*", "desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.flake8]
max-line-length = 120
exclude = [".venv", "build", "dist"]
