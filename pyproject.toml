[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codesaver"
version = "1.1.1"
description = "Automatic code backup utility for developers"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "CodeSaver Contributors" }]
keywords = ["backup", "developer-tools", "zip", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.scripts]
codesaver = "codesaver.cli:main"

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "flake8>=7.0",
]
release = [
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
include = ["codesaver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.flake8]
max-line-length = 120
exclude = [".venv", "build", "dist"]
